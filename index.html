*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font-family:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Hiragino Sans",sans-serif;display:flex;justify-content:center}
#app{width:100%;max-width:440px;min-height:100vh;padding:24px 20px 96px;text-align:center;position:relative;overflow:hidden}
.ac{color:var(--ac)}

.s{color:var(--sub);font-size:13px;margin:0}
.btn{display:block;width:100%;border:0;border-radius:999px;padding:16px;font-size:16px;font-weight:700;background:var(--ac);color:var(--acfg);cursor:pointer;margin-top:12px}
.btn.o{background:var(--card);color:var(--fg);border:1px solid var(--line);font-weight:500}
.btn:active{transform:scale(.98)}
.ring{position:relative;width:240px;height:240px;margin:28px auto}
.ring i{position:absolute;left:50%;top:50%;margin:-22px;width:44px;height:44px;font-style:normal;font-size:30px;line-height:44px}
.ring b{position:absolute;left:50%;top:50%;margin:-52px;width:104px;height:104px;border-radius:50%;background:var(--ac);opacity:.9;color:var(--acfg);font-size:17px;line-height:1.3;display:flex;align-items:center;justify-content:center}
.sub1{font-size:14px;color:var(--sub);margin:18px 0 0}
.name{font-size:36px;font-weight:800;color:var(--ac);margin:6px 0 16px;overflow-wrap:anywhere;line-height:1.3}
.pic{background:var(--soft);border-radius:24px;height:200px;display:flex;align-items:center;justify-content:center;font-size:110px}
.say{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin:-24px 14px 8px;position:relative;font-size:15px;line-height:1.7}

.nav{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;background:var(--bg);border-top:1px solid var(--line);padding:8px 0 calc(8px + env(safe-area-inset-bottom,0px))}

.nav button{flex:1;border:0;background:none;color:var(--sub);font-size:11px;cursor:pointer;padding:4px}
.nav button span{display:block;font-size:20px}
.nav button.on{color:var(--ac)}
.box{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:20px;text-align:left}
.box h2{font-size:17px;text-align:center;margin:0 0 14px}
.opt{display:flex;align-items:center;gap:12px;width:100%;border:1px solid var(--line);background:var(--card);color:var(--fg);border-radius:14px;padding:12px;margin-bottom:10px;text-align:left;cursor:pointer;font-size:15px}
.opt.on{border-color:var(--ac);background:var(--soft)}
.opt em{font-style:normal;font-size:26px}
.opt small{display:block;color:var(--sub);font-size:11px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--card);color:var(--fg);border-radius:999px;padding:8px 14px;font-size:13px;cursor:pointer}
.chip.on{background:var(--ac);color:var(--acfg);border-color:var(--ac)}
.lab{font-size:13px;color:var(--sub);margin:16px 0 8px}
.row{display:flex;align-items:center;gap:12px;width:100%;border:0;background:none;color:var(--fg);padding:12px 0;border-bottom:1px solid var(--line);text-align:left;cursor:pointer;font-size:15px}
.row .t{width:48px;height:48px;border-radius:12px;background:var(--soft);display:flex;align-items:center;justify-content:center;font-size:26px}
.row .d{color:var(--sub);font-size:12px}
.row .g{flex:1}
.sw{width:46px;height:26px;border-radius:13px;background:var(--line);position:relative;flex:none}
.sw:after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.2s}
.sw.on{background:var(--ac)}.sw.on:after{left:23px}
input{width:100%;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--bg);color:var(--fg);font-size:16px}
.step{display:flex;gap:12px;align-items:flex-start;margin-bottom:14px;font-size:14px;line-height:1.6}
.step b{flex:none;width:26px;height:26px;border-radius:50%;background:var(--ac);color:var(--acfg);display:flex;align-items:center;justify-content:center;font-size:13px}
.msg{color:var(--sub);font-size:14px;padding:30px 0}
.tt{font-size:17px;font-weight:700;margin:4px 0 16px}
button,input{font-family:inherit}
.name{font-weight:900}
.hero{min-height:calc(100vh - 150px);display:flex;flex-direction:column;justify-content:center}
.hero h1{font-size:42px}
.hero .btn{margin-top:40px}
.hero svg{display:block;width:150px;margin:0 auto 22px;filter:drop-shadow(0 6px 10px rgba(120,70,20,.14))}
.cap{font-size:13px;font-weight:700;color:var(--ac);letter-spacing:.12em;margin:18px 0 0}
h1{font-weight:900;letter-spacing:.02em;margin:6px 0 10px}
h1 .hl{background:linear-gradient(transparent 62%,rgba(255,106,19,.3) 62%);padding:0 4px}
.plate{position:relative;width:260px;height:260px;margin:22px auto 26px}
.plate .disc{position:absolute;inset:40px;border-radius:50%;background:var(--card);box-shadow:0 14px 34px rgba(255,106,19,.22),inset 0 0 0 10px var(--soft);display:flex;align-items:center;justify-content:center;flex-direction:column;gap:2px}
.plate .disc span{font-size:56px;animation:bob 2.4s ease-in-out infinite}
.plate .disc small{font-size:14px;font-weight:700;color:var(--ac)}
.plate i{position:absolute;left:50%;top:50%;width:44px;height:44px;margin:-22px;font-style:normal;font-size:26px;line-height:44px;background:var(--card);border-radius:50%;box-shadow:0 4px 12px rgba(0,0,0,.1);animation:bob 3s ease-in-out infinite}
@keyframes bob{50%{translate:0 -6px}}
.cta{box-shadow:0 10px 24px rgba(255,106,19,.35);font-size:17px}
.cnt{font-size:12px;color:var(--sub);margin:14px 0 0}
</style>

 var c=p.length>1?p.filter(function(i){return i!==S.cur}):p;
 S.cur=c[Math.floor(Math.random()*c.length)];S.saved=false;S.v="result";R();
}
function save(){
 if(S.saved)return;
 var d=new Date(),ds=d.getFullYear()+"/"+("0"+(d.getMonth()+1)).slice(-2)+"/"+("0"+d.getDate()).slice(-2);
 S.h.unshift({i:S.cur,d:ds});S.h=S.h.slice(0,50);S.saved=true;sv();R();
}
function setT(t){S.t=t;R()}
function setG(g){S.g=g;R()}
function tg(t){var k=S.ex.indexOf(t);if(k>-1)S.ex.splice(k,1);else S.ex.push(t);sv();R()}
function saveSet(){S.free=$("fr").value;sv();S.toast="保存しました ✓";R()}
function show(i){S.cur=i;S.saved=true;S.v="result";R()}
function nav(){
 var items=[["top","🏠","ホーム"],["hist","🕘","履歴"],["set","⚙️","設定"],["how","ⓘ","使い方"]];
 return '<div class="nav"><div>'+items.map(function(x){return '<button class="'+(S.v===x[0]?"on":"")+'" onclick="go(\''+x[0]+'\')"><span>'+x[1]+'</span>'+x[2]+'</button>'}).join("")+'</div></div>';
}
function dots(){
 var h="",cs=["#ff6a13","#ffb27a","#aaa","#ff8f4a"];
 for(var i=0;i<16;i++){h+='<span class="dot" style="left:'+(Math.random()*92+2)+'%;top:'+(Math.random()*150+10)+'px;background:'+cs[i%4]+';animation-delay:'+(i*0.03)+'s"></span>'}
 return h;
}
function R(){
 var h="",v=S.v;
 if(v==="top"){
  var em=["🍚","🍜","🍛","🍣","🍝","🍙"],ring="";
  em.forEach(function(e,i){var a=i*60;ring+='<i style="transform:rotate('+a+'deg) translateY(-108px) rotate(-'+a+'deg);animation-delay:'+(i*0.4)+'s">'+e+'</i>'});
  h='<div class="hero"><svg viewBox="0 0 200 172" aria-hidden="true"><ellipse cx="100" cy="162" rx="56" ry="7" style="fill:var(--soft)"/><path d="M34 98c0-42 28-64 66-64s66 22 66 64z" style="fill:var(--card)"/><path d="M100 34c38 0 66 22 66 64h-18c0-30-18-56-48-64z" style="fill:var(--soft)"/><ellipse cx="66" cy="58" rx="5" ry="2.6" transform="rotate(-30 66 58)" style="fill:var(--line)"/><ellipse cx="94" cy="44" rx="5" ry="2.6" transform="rotate(20 94 44)" style="fill:var(--line)"/><ellipse cx="124" cy="50" rx="5" ry="2.6" transform="rotate(-20 124 50)" style="fill:var(--line)"/><ellipse cx="146" cy="68" rx="5" ry="2.6" transform="rotate(35 146 68)" style="fill:var(--line)"/><ellipse cx="60" cy="78" rx="5" ry="2.6" transform="rotate(15 60 78)" style="fill:var(--line)"/><circle cx="84" cy="78" r="5" style="fill:var(--fg)"/><circle cx="116" cy="78" r="5" style="fill:var(--fg)"/><path d="M94 86q6 6 12 0" style="fill:none;stroke:var(--fg)" stroke-width="3" stroke-linecap="round"/><ellipse cx="72" cy="89" rx="8" ry="5" fill="#ff9d8f" opacity=".7"/><ellipse cx="128" cy="89" rx="8" ry="5" fill="#ff9d8f" opacity=".7"/><path d="M28 96h144c0 36-30 62-72 62s-72-26-72-62z" style="fill:var(--ac)"/><path d="M50 116h100" style="stroke:var(--acfg);opacity:.4" stroke-width="5" stroke-linecap="round"/><path d="M172 28l3 8 8 3-8 3-3 8-3-8-8-3 8-3z" style="fill:var(--ac)"/><path d="M30 52l2 5 5 2-5 2-2 5-2-5-5-2 5-2z" style="fill:var(--ac)"/></svg><h1>今日、<br><span class="hl">何食べる？</span></h1><p class="s">ワンタップで、今日のごはんを決めよう。</p><button class="btn cta" onclick="go(\'pick\')">今日のごはんを決める！</button></div>'+nav();
 }else if(v==="pick"){
  var ts=[["l","☀️","昼ごはん","ランチにおすすめ"],["d","🌇","夜ごはん","ディナーにおすすめ"],["any","🌙","なんでもOK","時間帯を問わず提案"]];
  h='<div class="box"><h2>いつのごはん？</h2>'+ts.map(function(x){return '<button class="opt'+(S.t===x[0]?" on":"")+'" onclick="setT(\''+x[0]+'\')"><em>'+x[1]+'</em><span>'+x[2]+'<small>'+x[3]+'</small></span></button>'}).join("")+'<div class="lab">ジャンルを選ぶ</div><div class="chips">'+G.map(function(g){return '<button class="chip'+(S.g===g?" on":"")+'" onclick="setG(\''+g+'\')">'+g+'</button>'}).join("")+'</div></div><button class="btn" onclick="decide()">この条件で決める</button><button class="btn o" onclick="go(\'top\')">キャンセル</button>';
 }else if(v==="result"){
  if(S.cur<0){h='<div class="msg">条件に合う料理がありませんでした。<br>ジャンルや除外設定をゆるめてみてください。</div><button class="btn" onclick="go(\'pick\')">条件を変える</button>'+nav();}
  else{var m=M[S.cur];
   h=dots()+'<p class="sub1">＼ 今日のおすすめは… ／</p><div class="name" style="font-size:'+(m[0].length>10?24:m[0].length>7?29:36)+'px">'+esc(m[0])+'</div><div class="pic">'+m[1]+'</div><div class="say">'+m[2]+'</div><button class="btn" onclick="decide()">↻ もう一回決める</button><button class="btn o" onclick="save()">'+(S.saved?"✓ 履歴に保存しました":"🔖 履歴に保存する")+'</button><button class="btn o" onclick="go(\'pick\')">条件を変える</button>'+nav();}
 }else if(v==="hist"){
  h='<div class="tt">履歴</div>'+(S.h.length?S.h.map(function(x){var m=M[x.i];return m?'<button class="row" onclick="show('+x.i+')"><span class="t">'+m[1]+'</span><span class="g">'+esc(m[0])+'<div class="d">'+x.d+'</div></span>›</button>':""}).join(""):'<div class="msg">まだ履歴がありません。<br>結果画面の「履歴に保存する」で貯まります。</div>')+nav();
 }else if(v==="set"){
  h='<div class="box"><h2>苦手な料理を除外</h2><p class="s" style="text-align:center;margin-bottom:8px">選択した料理は、結果に出てこなくなります。</p>'+TAGS.map(function(t){return '<button class="row" onclick="tg(\''+t+'\')"><span class="g">'+t+'</span><span class="sw'+(S.ex.indexOf(t)>-1?" on":"")+'"></span></button>'}).join("")+'<div class="lab">その他（自由入力）</div><input id="fr" value="'+esc(S.free)+'" placeholder="例：セロリ、ラム肉 など"><p class="s" style="margin-top:6px">※料理名に含まれる言葉で除外します（カンマ区切り）</p></div><button class="btn" onclick="saveSet()">保存する</button><p class="s" style="margin-top:10px;color:var(--ac)">'+S.toast+'</p>'+nav();
 }else if(v==="how"){
  var st=["アプリを開く","「今日のごはんを決める！」をタップ","昼・夜とジャンルを選んで決定","おすすめの料理が1つ表示されます","「もう一回決める」で他の候補を表示"];
  h='<div class="tt">使い方</div><div class="box">'+st.map(function(s,i){return '<div class="step"><b>'+(i+1)+'</b><span>'+s+'</span></div>'}).join("")+'</div><div class="box" style="margin-top:14px"><div class="step" style="margin:0"><span>✓ 迷う時間をゼロに<br>✓ 自分の好みに合わせてカスタマイズ<br>✓ 履歴から「また食べたい！」が見つかる</span></div></div>'+nav();
 }
 $("app").innerHTML=h;window.scrollTo(0,0);
}
R();
</script>
</body>
</html>
